version: '3.3'

services:
  pdf-editor:
    # 使用精简版镜像 (280MB，比原版小78.8%)
    image: pdf-editor-uos:lean
    
    # 容器名称
    container_name: pdf-editor-app
    
    # 端口映射 (主机端口:容器端口)
    ports:
      - "5000:5000"
    
    # 环境变量
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - TZ=Asia/Shanghai
    
    # 数据卷挂载 (持久化上传和处理的文件)
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
    
    # 重启策略
    restart: unless-stopped
    
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:5000/\", timeout=5)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 网络模式
    networks:
      - pdf-network

networks:
  pdf-network:
    driver: bridge
